name: Temporary reused-depth index benchmark
on:
  pull_request:
    paths:
      - .github/workflows/temporary-reused-depth-index-benchmark.yml
permissions:
  contents: read
jobs:
  compare:
    if: github.head_ref == 'perf/reuse-level-index-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r validator/requirements-dev.txt
      - name: Independently validate reuse-level reports against old scanning algorithm
        env:
          PYTHONPATH: kit/scripts:kit/tests
        run: python -m pytest -q kit/tests/test_graph_reused_depth_index.py
      - name: Pair measured full graph analytics against previous main
        env:
          PYTHONPATH: kit/scripts:kit/tests
        run: |
          git show 1847bd8e31bfe40d1e340293764d2929814f64a8:kit/scripts/wikidebia_graph_extract.py > /tmp/baseline_graph_extract.py
          python - <<'PY'
          import importlib.util, json, statistics, sys, time
          import wikidebia_graph_extract as indexed
          from test_graph_analyze_dag_suffix_counts import synthetic_result

          spec=importlib.util.spec_from_file_location('baseline_graph_extract','/tmp/baseline_graph_extract.py')
          baseline=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=baseline
          spec.loader.exec_module(baseline)

          def fixture(kind,n):
              names=[f'N{i:04d}' for i in range(n)]
              if kind=='chain':
                  edges=[(names[i],'justification',names[i+1]) for i in range(n-1)]
                  roots=[names[0]]
              elif kind=='shortcut':
                  edges=[(names[i],'justification',names[i+1]) for i in range(n-1)]
                  edges.append((names[0],'objection',names[-1]))
                  roots=[names[0]]
              elif kind=='wide':
                  # n roots, with one child each: many nodes but two levels.
                  children=[f'Child{i:04d}' for i in range(n)]
                  edges=[(names[i],'justification',children[i]) for i in range(n)]
                  roots=names
                  names.extend(children)
              elif kind=='shared_chain':
                  roots=[f'Root {i}' for i in range(8)]
                  names=[*roots, *[f'S{i:04d}' for i in range(n)]]
                  edges=[(r,'justification',names[8]) for r in roots]
                  edges.extend((names[i],'objection',names[i+1]) for i in range(8,len(names)-1))
              elif kind=='layered':
                  width=24
                  names=[f'L{l:03d}-{i:02d}' for l in range(n) for i in range(width)]
                  roots=names[:width]
                  edges=[]
                  for level in range(n-1):
                      for i in range(width):
                          a=names[level*width+i]
                          edges.append((a,'justification',names[(level+1)*width+i]))
                          edges.append((a,'objection',names[(level+1)*width+(i+1)%width]))
              else: raise ValueError(kind)
              return synthetic_result(names,roots[:len(roots)//2],roots[len(roots)//2:],edges)

          scenarios=[
              ('chain',240,5),
              ('chain',800,5),
              ('chain',2000,3),
              ('chain',4000,3),
              ('shortcut',240,5),
              ('shortcut',800,5),
              ('shortcut',2000,3),
              ('shared_chain',240,5),
              ('shared_chain',800,5),
              ('shared_chain',2000,3),
              ('shared_chain',4000,3),
              ('wide',300,5),
              ('layered',22,5),
          ]
          for kind,n,reps in scenarios:
              graph=fixture(kind,n)
              paths={'baseline':baseline.analyze_graph,'indexed':indexed.analyze_graph}
              samples={'baseline':[], 'indexed':[]}
              for i in range(reps):
                  pair={}
                  for mode in (('baseline','indexed') if i%2==0 else ('indexed','baseline')):
                      start=time.perf_counter()
                      outcome=paths[mode](graph)
                      elapsed=time.perf_counter()-start
                      pair[mode]=outcome
                      samples[mode].append(round(elapsed,6))
                  assert pair['baseline']==pair['indexed'],('full_output_changed',kind,n,i)
              medians={mode:statistics.median(vals) for mode,vals in samples.items()}
              print('MEASURE',json.dumps({
                  'scenario':kind,'size':n,'nodes':len(graph.parsed_arguments),
                  'medians_seconds':medians,'samples_seconds':samples,
                  'gain_percent':round(100*(1-medians['indexed']/medians['baseline']),2),
                  'full_analyzed_graph_identical':True,'wiki_reads':0,
              },sort_keys=True),flush=True)
          PY
