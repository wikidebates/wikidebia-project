name: Temporary validator scope performance audit

on:
  pull_request:
    paths:
      - .github/workflows/temporary-validator-scope-audit.yml

permissions:
  contents: read

jobs:
  profile:
    if: github.head_ref == 'audit/validator-scope-costs-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: validator/requirements-dev.txt
      - run: python -m pip install -r validator/requirements-dev.txt
      - name: Time all validator scopes without changing any validation
        env:
          PYTHONPATH: kit/scripts:validator/src
        run: |
          python - <<'PY'
          import json
          import statistics
          import tempfile
          import time
          from pathlib import Path
          from wikidebia_pretranslation_benchmark import make_synthetic_extraction
          from wikidebia_corpus_init import build_corpus
          from wikidebia_validator.validator import validate_package, ALL_SCOPES
          for size, padding in ((40, 256), (120, 1024)):
              with tempfile.TemporaryDirectory(prefix="wikidebia-scope-perf-") as name:
                  folder = Path(name)
                  source = make_synthetic_extraction(folder / "source", arguments=size, payload_bytes=padding)
                  target = folder / "build"
                  build_corpus(source, target, debate_id="benchmark_pretranslation", short_code="BENCH", scope_summary=None, overwrite=False)
                  for scope in [None, *ALL_SCOPES]:
                      samples = []
                      for trial in range(4):
                          started = time.perf_counter()
                          report = validate_package(target, scopes=[scope] if scope else None)
                          elapsed = time.perf_counter() - started
                          # A graph_draft is not yet editorially complete: some
                          # optional future-stage scopes intentionally report
                          # findings. Measure them, but do not call them 'passed'.
                          samples.append(elapsed)
                      print("AUDIT_SCOPE", json.dumps({
                          "size": size, "scope": scope or "all", "repeats": 4,
                          "last_error_count": report.errors,
                          "median_seconds": round(statistics.median(samples), 6),
                          "stdev_seconds": round(statistics.pstdev(samples), 6),
                          "samples_seconds": [round(x,6) for x in samples]
                      }, sort_keys=True))
          # Experimental only: measure the cost of JSON Schema meta-validation.
          # No repository validator code is modified.
          import jsonschema
          from wikidebia_validator.validator import validate_package
          from jsonschema.validators import Draft202012Validator
          with tempfile.TemporaryDirectory(prefix="wikidebia-schema-audit-") as name:
              folder = Path(name)
              source = make_synthetic_extraction(folder / "source", arguments=120, payload_bytes=1024)
              target = folder / "build"
              build_corpus(source, target, debate_id="benchmark_pretranslation", short_code="BENCH", scope_summary=None, overwrite=False)
              def run_n(times=5):
                  samples = []
                  canonical = None
                  for _ in range(times):
                      start = time.perf_counter()
                      report = validate_package(target, scopes=["schema"])
                      samples.append(time.perf_counter() - start)
                      value = report.to_dict()
                      if canonical is None:
                          canonical = value
                      elif value != canonical:
                          raise RuntimeError("The identical validator yielded inconsistent reports")
                  return samples, canonical
              normal, before = run_n()
              original_check = Draft202012Validator.__dict__.get("check_schema")
              try:
                  Draft202012Validator.check_schema = classmethod(lambda cls, schema, format_checker=None: None)
                  nocheck, after = run_n()
              finally:
                  if original_check is None:
                      delattr(Draft202012Validator, "check_schema")
                  else:
                      Draft202012Validator.check_schema = original_check
              if before != after:
                  raise RuntimeError("Error reports changed when schema meta-validation was bypassed experimentally")
              print("SCHEMA_CHECK_EXPERIMENT", json.dumps({
                  "size": 120, "samples_normal": [round(x,6) for x in normal],
                  "samples_experimental": [round(x,6) for x in nocheck],
                  "normal_median_seconds": round(statistics.median(normal),6),
                  "experimental_median_seconds": round(statistics.median(nocheck),6),
                  "reports_identical": True,
                  "production_code_unchanged": True
              }, sort_keys=True))
          PY
