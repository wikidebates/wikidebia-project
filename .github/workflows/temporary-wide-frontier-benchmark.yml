name: Temporary broad graph frontier deduplication benchmark
on:
  pull_request:
    paths:
      - .github/workflows/temporary-wide-frontier-benchmark.yml
permissions:
  contents: read
jobs:
  compare:
    if: github.head_ref == 'perf/wide-frontier-set-dedup-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r validator/requirements-dev.txt
      - name: Test root ordering, shared frontier batching and page safety
        env:
          PYTHONPATH: kit/scripts
        run: python -m pytest -q kit/tests/test_wide_graph_frontier_dedup.py
      - name: Benchmark broad root and child frontiers against pinned main
        env:
          PYTHONPATH: kit/scripts
        run: |
          git show 5100395b819e7f7bb40df50882a52f7f54366e1e:kit/scripts/wikidebia_graph_extract.py > /tmp/baseline_graph_extract.py
          python - <<'PY'
          import dataclasses, importlib.util, json, statistics, sys, time
          import wikidebia_graph_extract as improved

          spec=importlib.util.spec_from_file_location('baseline_graph_extract','/tmp/baseline_graph_extract.py')
          baseline=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=baseline
          spec.loader.exec_module(baseline)

          class FakeClient:
              def __init__(self,module,pages):
                  self.module=module
                  self.pages=pages
                  self.aliases={}
                  self.batches=[]
              def fetch(self,title):
                  if title not in self.pages:
                      raise self.module.PageMissingError(title)
                  return self.module.PageRecord(
                      requested_title=title,canonical_title=title,text=self.pages[title],
                      url='https://example.invalid/wiki/'+title,revision_id=1)
              def fetch_many(self,titles):
                  self.batches.append(tuple(titles))
                  return {title:self.fetch(title) for title in titles}

          def pages_for(n,kind):
              titles=[f'Argument {k:04d}' for k in range(1,n+1)]
              argument='{{Argument|justifications=|objections=}}'
              pages={t:argument for t in titles}
              if kind=='roots':
                  pages['Débat test']='{{Débat|arguments-pour='+''.join(
                      '{{Argument pour|page='+t+'}}' for t in titles
                  )+'|arguments-contre=}}'
              else:
                  pages['Débat test']='{{Débat|arguments-pour={{Argument pour|page=Racine}}|arguments-contre=}}'
                  pages['Racine']='{{Argument|justifications='+''.join(
                      '{{Justification|page='+t+'}}' for t in titles
                  )+'|objections=}}'
              return pages

          for n in (120,300,700,2000,4000):
              for kind in ('roots','children'):
                  pages=pages_for(n,kind)
                  versions={'baseline':baseline,'sets':improved}
                  samples={'baseline':[],'sets':[]}
                  for i in range(6 if n<=700 else 4):
                      pair={}
                      for name in (('baseline','sets') if i%2==0 else ('sets','baseline')):
                          module=versions[name]
                          client=FakeClient(module,pages)
                          start=time.perf_counter()
                          result=module.crawl_graph(client,debate_title='Débat test',progress_every=0)
                          samples[name].append(round(time.perf_counter()-start,6))
                          pair[name]=(dataclasses.asdict(result),client.batches)
                      assert pair['baseline']==pair['sets'],('different_crawl_result_or_fetch_batches',n,kind,i)
                  medians={key:statistics.median(samples[key]) for key in samples}
                  print('MEASURE',json.dumps({
                      'arguments':n,'frontier_shape':kind,
                      'medians_seconds':medians,'samples_seconds':samples,
                      'gain_percent':round(100*(1-medians['sets']/medians['baseline']),2),
                      'complete_crawl_result_and_fetch_batches_identical':True,
                      'no_wiki_network_access':True
                  },sort_keys=True),flush=True)
          PY
