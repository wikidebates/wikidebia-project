name: Temporary actual primitive-type validator benchmark
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r validator/requirements-dev.txt
      - name: Compare final production primitive guard against original keyword
        env:
          PYTHONPATH: kit/scripts:validator/src
        run: |
          python - <<'PY'
          import json
          import statistics
          import tempfile
          import time
          from pathlib import Path
          from unittest.mock import patch
          from wikidebia_pretranslation_benchmark import make_synthetic_extraction
          from wikidebia_corpus_init import build_corpus
          from wikidebia_validator.validator import validate_package
          import wikidebia_validator.schema_validation as sv

          SCOPES=("schema","coherence","graph","files","workflow")
          assert sv._matches_attested_library_versions(), "Exact pinned library versions required"
          for count in (40,300,680):
              with tempfile.TemporaryDirectory(prefix="wikidebia-primitive-production-") as tmp:
                  root=Path(tmp)
                  source=make_synthetic_extraction(root/"source",arguments=count,payload_bytes=1024)
                  built=root/"build"
                  build_corpus(source,built,debate_id="benchmark_pretranslation",short_code="BENCH",scope_summary=None,overwrite=False)
                  samples={"before":[],"after":[]}
                  for repeat in range(7):
                      reports={}
                      for mode in (("after","before") if repeat%2==0 else ("before","after")):
                          start=time.perf_counter()
                          if mode=="before":
                              with patch.object(sv,"_guarded_registry_primitive_type",lambda cls,_expanded:cls):
                                  reports[mode]=validate_package(built,scopes=SCOPES).to_dict()
                          else:
                              reports[mode]=validate_package(built,scopes=SCOPES).to_dict()
                          samples[mode].append(time.perf_counter()-start)
                      if reports["after"]!=reports["before"]:
                          raise AssertionError("Complete report changes on valid package")
                      if reports["before"]["summary"]["errors"]:
                          raise AssertionError("Unexpectedly invalid synthetic package")
                  old=statistics.median(samples["before"])
                  new=statistics.median(samples["after"])
                  print("WIKIDEBIA_PRODUCTION_PRIMITIVE_TYPE "+json.dumps({
                      "arguments":count,
                      "baseline_median_s":round(old,6),
                      "optimized_median_s":round(new,6),
                      "gain_percent":round((old-new)/old*100,2),
                      "samples_before_s":[round(x,6) for x in samples["before"]],
                      "samples_after_s":[round(x,6) for x in samples["after"]],
                      "alternate_samples":7,
                      "same_full_validator_reports":True,
                      "same_normative_schemas":True,
                      "wiki_access_performed":False,
                  },sort_keys=True),flush=True)
          PY
