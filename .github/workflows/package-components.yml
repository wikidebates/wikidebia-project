name: Export des composants

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/build_component_bundle.py'
      - '.github/workflows/package-components.yml'
      - 'kit/PACKAGE_MANIFEST_SHA256.json'
      - 'validator/PACKAGE_MANIFEST_SHA256.json'
      - 'norms/PACKAGE_MANIFEST_SHA256.json'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and verify component archives
        run: python tools/build_component_bundle.py --output "$RUNNER_TEMP/wikidebia-components"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wikidebia-components-${{ github.sha }}
          path: ${{ runner.temp }}/wikidebia-components/
          if-no-files-found: error
          retention-days: 30
