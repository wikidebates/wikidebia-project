name: Install tested creation initializer (temporary)
on:
  push:
    branches: [feat/creation-init-20261121]
    paths: [.github/workflows/creation-init-install.yml]
permissions:
  contents: read
jobs:
  install:
    if: github.repository == 'wikidebates/wikidebia-project' && github.ref == 'refs/heads/feat/creation-init-20261121'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply byte-verified integration and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object kit/scripts/wikidebia_creation_init.py)" = '5bc9fa35ceb078625ac5d9ecf985860170ae5b02'
          test "$(git hash-object kit/tests/test_wikidebia_creation_init.py)" = 'b58375b8d34fcda178c29ac78b1b7210174a76c9'
          test "$(git hash-object .github/creation-init-integration.patch)" = 'a1899647512faf8104b3123a674f1530d3746b88'
          git apply --check .github/creation-init-integration.patch
          git apply .github/creation-init-integration.patch
          rm .github/creation-init-integration.patch .github/workflows/creation-init-source.yml .github/workflows/creation-init-install.yml
          # These counts come from successful local JUnit reports. The ordinary PR CI reruns all suites.
          python validator/scripts/refresh_package_metadata.py --test-count 1189 --generated-date 2026-11-21
          python kit/scripts/refresh_package_metadata.py --test-count 1824 --generated-date 2026-11-21
          git add -- AGENTS.md kit/GUIDE_CREATION_CONTEXT.md kit/GUIDE_CREATION_INIT.md kit/examples/creation_plan.example.json kit/scripts/wikidebia_creation_init.py kit/scripts/wikidebia_manage.py kit/tests/test_wikidebia_creation_init.py kit/PACKAGE_MANIFEST_SHA256.json kit/PACKAGE_RECEIPT.json kit/TEST_REPORT.txt validator/src/wikidebia_validator/coherence.py validator/tests/test_creation_planned_name_discovery.py validator/PACKAGE_MANIFEST_SHA256.json validator/PACKAGE_RECEIPT.json validator/docs/TEST_REPORT.txt validator/docs/SELF_AUDIT_REPORT.txt
          git add -u -- .github
          git diff --cached --check
          test "$(git write-tree)" = '430ba381f10e5394c36965aa076258ecac223d57'
          echo 'Exact locally tested source tree verified.'
      - name: Commit exact tree to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wikidebia creation preparation'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: initialize a new French corpus from a bound reviewed plan'
          git push origin HEAD:refs/heads/feat/creation-init-20261121
