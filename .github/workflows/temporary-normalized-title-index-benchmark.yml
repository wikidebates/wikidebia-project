name: Temporary normalized-title index benchmark
on:
  pull_request:
    paths:
      - .github/workflows/temporary-normalized-title-index-benchmark.yml
permissions:
  contents: read
jobs:
  compare:
    if: github.head_ref == 'perf/normalized-snapshot-title-index-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r validator/requirements-dev.txt
      - name: Run normalized title matching regressions
        env:
          PYTHONPATH: kit/scripts
        run: python -m pytest -q kit/tests/test_wikidebia_corpus_init.py -k 'normalized or normalization or snapshot_match or normalized_alias'
      - name: Compare normalized alias imports against pinned main
        env:
          PYTHONPATH: kit/scripts
        run: |
          git show afff1dc1732bae883ba048a811f2ede8cff64743:kit/scripts/wikidebia_corpus_init.py > /tmp/baseline_corpus_init.py
          python - <<'PY'
          import hashlib, importlib.util, json, statistics, sys, tempfile, time
          from pathlib import Path
          from wikidebia_pretranslation_benchmark import make_synthetic_extraction
          from wikidebia_corpus_init import (
              build_corpus, copy_import_pages, ordered_titles,
              resolve_extraction_input, verify_extraction,
          )

          spec=importlib.util.spec_from_file_location('baseline_corpus_init','/tmp/baseline_corpus_init.py')
          old=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=old
          spec.loader.exec_module(old)
          def dump(path, data):
              path.write_text(json.dumps(data,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          def digest_tree(folder):
              return {p.relative_to(folder).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in folder.rglob('*.wiki') if p.is_file()}

          with tempfile.TemporaryDirectory() as d:
              base=Path(d)
              for n in (120,300,700):
                  root=base/str(n)
                  src=make_synthetic_extraction(root/'source',arguments=n,payload_bytes=512)
                  snapshot=src/'snapshot/snapshot_manifest.json'
                  manifest=json.loads(snapshot.read_text(encoding='utf-8'))
                  for row in manifest['arguments']:
                      row['canonical_title']=row['canonical_title'].replace(' ','_')
                  dump(snapshot,manifest)
                  audit=src/'benchmark_manifest_sha256_2026-01-01.json'
                  audited=json.loads(audit.read_text(encoding='utf-8'))
                  for row in audited['files']:
                      if row['path']=='snapshot/snapshot_manifest.json':
                          data=snapshot.read_bytes()
                          row['size_bytes']=len(data)
                          row['sha256']=hashlib.sha256(data).hexdigest()
                  dump(audit,audited)
                  inp=resolve_extraction_input(src)
                  graph,validated_snapshot=verify_extraction(inp)
                  titles=ordered_titles(graph)
                  ids={title:f'A{i:04d}' for i,title in enumerate(titles,1)}
                  methods={'old':old.copy_import_pages,'indexed':copy_import_pages}
                  results={'old':[],'indexed':[]}
                  for k in range(6):
                      comparable={}
                      for name in (('old','indexed') if k%2==0 else ('indexed','old')):
                          out=root/f'copy-{k}-{name}'
                          begin=time.perf_counter()
                          imported, data=methods[name](inp,validated_snapshot,out,ids)
                          duration=time.perf_counter()-begin
                          assert set(imported)==set(ids)
                          comparable[name]=(imported,data['provenance']['pages'],digest_tree(out/'imports'))
                          results[name].append(round(duration,6))
                      assert comparable['old']==comparable['indexed'],('copy_output_changed',n,k)
                  medians={name:statistics.median(samples) for name,samples in results.items()}
                  print('COPY_MEASURE',json.dumps({
                      'arguments':n,'medians':medians,'samples':results,
                      'gain_percent':round(100*(1-medians['indexed']/medians['old']),2),
                      'exact_imported_metadata_and_pages':True,
                  },sort_keys=True),flush=True)

                  if n in (300,700):
                      full={'old':[],'indexed':[]}
                      for k in range(4):
                          pair={}
                          for name in (('old','indexed') if k%2==0 else ('indexed','old')):
                              out=root/f'full-{k}-{name}'
                              build=old.build_corpus if name=='old' else build_corpus
                              begin=time.perf_counter()
                              result=build(src,out,debate_id='benchmark_pretranslation',
                                  short_code='BENCH',scope_summary=None,overwrite=False)
                              full[name].append(round(time.perf_counter()-begin,6))
                              pair[name]=(result['build_contract_sha256'],digest_tree(out/'imports'))
                          assert pair['old']==pair['indexed'],('full_output_changed',n,k)
                      med={name:statistics.median(v) for name,v in full.items()}
                      print('BUILD_MEASURE',json.dumps({
                          'arguments':n,'medians':med,'samples':full,
                          'gain_percent':round(100*(1-med['indexed']/med['old']),2),
                          'same_verified_contract_and_imported_bytes':True,
                      },sort_keys=True),flush=True)
          PY
