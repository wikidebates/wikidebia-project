name: Temporary pretranslation performance measurement

on:
  pull_request:
    paths:
      - .github/workflows/temporary-pretranslation-measure.yml

permissions:
  contents: read

jobs:
  offline-benchmark:
    if: github.head_ref == 'audit/pretranslation-measure-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: validator/requirements-dev.txt
      - run: python -m pip install -r validator/requirements-dev.txt
      - name: Profile 40-argument corpus with three repeated runs
        run: |
          PYTHONPATH=kit/scripts python kit/scripts/wikidebia_pretranslation_benchmark.py \
            --arguments 40 --payload-bytes 256 --iterations 3 \
            --output /tmp/pretranslation-40.json --machine-readable
      - name: Profile 120-argument corpus with three repeated runs
        run: |
          PYTHONPATH=kit/scripts python kit/scripts/wikidebia_pretranslation_benchmark.py \
            --arguments 120 --payload-bytes 1024 --iterations 3 \
            --output /tmp/pretranslation-120.json --machine-readable
      - name: Compact offline timing summary
        run: |
          python - <<'PY'
          import json
          for size in (40, 120):
              report = json.load(open(f"/tmp/pretranslation-{size}.json", encoding="utf-8"))
              print("SCENARIO", size, "contract", report["fixture"]["build_contract_sha256"])
              for name, row in report["scenarios"].items():
                  stages = {k: v["median_seconds"] for k, v in row["stage_timings_seconds"].items()}
                  print(json.dumps({"size": size, "scenario": name,
                      "median_seconds": row["median_seconds"],
                      "stddev_seconds": row["population_stddev_seconds"],
                      "stages_median_seconds": stages}, sort_keys=True))
              assert report["quality_controls"]["same_build_contract"]
              assert report["quality_controls"]["wiki_access_performed"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: offline-pretranslation-metrics
          path: /tmp/pretranslation-*.json
          retention-days: 7
          if-no-files-found: error
