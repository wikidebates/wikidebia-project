name: Temporary signed kit metadata refresh
on:
  push:
    branches:
      - fix/reconcile-signed-published-remote-plan-ready-20261116
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r validator/requirements-dev.txt
      - run: python -m pytest -q kit/tests --junitxml=/tmp/kit-tests.xml
      - run: python kit/scripts/refresh_package_metadata.py --junit-xml /tmp/kit-tests.xml
      - name: Commit generated signed metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kit/TEST_REPORT.txt kit/PACKAGE_MANIFEST_SHA256.json kit/PACKAGE_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m "build(kit): refresh signed metadata after passing regression tests"
            git push origin HEAD:fix/reconcile-signed-published-remote-plan-ready-20261116
          fi
