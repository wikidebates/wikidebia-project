name: Temporary bounded-depth frontier title profile
on:
  pull_request:
    paths:
      - .github/workflows/temporary-depth-frontier-profile.yml
permissions:
  contents: read
jobs:
  benchmark:
    if: github.head_ref == 'perf/depth-frontier-title-index-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r validator/requirements-dev.txt
      - name: Test depth-frontier semantics and linearity
        env:
          PYTHONPATH: kit/scripts
        run: python -m pytest -q kit/tests/test_depth_frontier_title_index.py
      - name: Compare baseline and indexed depth-frontier resolution with identical output
        env:
          PYTHONPATH: kit/scripts
        run: |
          git show 823c9aa9f49ab516591df6a60b6bebf48fd0bcc1:kit/scripts/wikidebia_corpus_init.py > /tmp/baseline_corpus_init.py
          python - <<'PY'
          import hashlib, importlib.util, json, statistics, sys, tempfile, time
          from pathlib import Path
          from wikidebia_pretranslation_benchmark import make_synthetic_extraction
          from wikidebia_corpus_init import _depth_policy, build_corpus, verify_extraction, resolve_extraction_input

          spec=importlib.util.spec_from_file_location('baseline_corpus_init','/tmp/baseline_corpus_init.py')
          old=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=old
          spec.loader.exec_module(old)

          with tempfile.TemporaryDirectory() as tmp:
              root=Path(tmp)
              for count in (300,700,1500):
                  source=make_synthetic_extraction(root/str(count)/'source',arguments=count,payload_bytes=128)
                  graph_path=source/'benchmark_graphe_recursif_2026-01-01.json'
                  graph=json.loads(graph_path.read_text(encoding='utf-8'))
                  graph['metadata']['limite_profondeur']=6
                  graph['metadata']['relations_ignorees_limite_profondeur']=count
                  graph['frontières_profondeur']={
                      node['titre'].replace(' ','_'): 1 for node in graph['noeuds']
                  }
                  graph_path.write_text(json.dumps(graph,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
                  audit_path=source/'benchmark_manifest_sha256_2026-01-01.json'
                  audit=json.loads(audit_path.read_text(encoding='utf-8'))
                  for entry in audit['files']:
                      if entry['path']==graph_path.name:
                          data=graph_path.read_bytes()
                          entry['size_bytes']=len(data)
                          entry['sha256']=hashlib.sha256(data).hexdigest()
                  audit_path.write_text(json.dumps(audit,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')

                  extraction=resolve_extraction_input(source)
                  checked_graph,_=verify_extraction(extraction)
                  mapping={x['titre']:f'A{i:04d}' for i,x in enumerate(checked_graph['noeuds'],1)}
                  implementations={'baseline':old._depth_policy,'indexed':_depth_policy}
                  observations={'baseline':[],'indexed':[]}
                  for i in range(6):
                      pair={}
                      for name in (('baseline','indexed') if i%2==0 else ('indexed','baseline')):
                          start=time.perf_counter()
                          result=implementations[name](checked_graph,mapping,6)
                          observations[name].append(round(time.perf_counter()-start,6))
                          pair[name]=result
                      assert pair['baseline']==pair['indexed']
                  median={k:statistics.median(v) for k,v in observations.items()}
                  print('FRONTIER_MEASURE',json.dumps({
                      'arguments':count,'median_seconds':median,'samples_seconds':observations,
                      'reduction_percent':round(100*(1-median['indexed']/median['baseline']),2),
                      'exact_depth_policy':True,
                  },sort_keys=True),flush=True)

                  if count in (300,700):
                      whole={'baseline':[],'indexed':[]}
                      for i in range(4):
                          pair={}
                          for name in (('baseline','indexed') if i%2==0 else ('indexed','baseline')):
                              output=root/str(count)/f'{name}-{i}'
                              implementation=old.build_corpus if name=='baseline' else build_corpus
                              start=time.perf_counter()
                              build=implementation(source,output,debate_id='benchmark_pretranslation',
                                  short_code='BENCH',scope_summary=None,overwrite=False)
                              whole[name].append(round(time.perf_counter()-start,6))
                              parsed=json.loads((output/'graph/graphe_argumentatif.json').read_text(encoding='utf-8'))
                              pair[name]=(
                                  build['build_contract_sha256'], parsed['depth_policy'],
                                  parsed['derived_counts'], parsed['nodes'], parsed['edges'], parsed['occurrences'],
                                  [(p.name,hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted((output/'imports/fr/arguments').glob('*.wiki'))]
                              )
                          assert pair['baseline']==pair['indexed'],('full_output_changed',count,i)
                      med={k:statistics.median(v) for k,v in whole.items()}
                      print('BUILD_MEASURE',json.dumps({
                          'arguments':count,'median_seconds':med,'samples_seconds':whole,
                          'reduction_percent':round(100*(1-med['indexed']/med['baseline']),2),
                          'exact_structures_and_contract':True,
                      },sort_keys=True),flush=True)
          PY
