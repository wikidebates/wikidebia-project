name: Temporary production conditional-if differential benchmark
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r validator/requirements-dev.txt
      - name: Compare exact full validation with native and guarded conditionals
        env:
          PYTHONPATH: kit/scripts:validator/src
        run: |
          python - <<'PY'
          import json
          import statistics
          import tempfile
          import time
          from pathlib import Path
          from unittest.mock import patch

          from wikidebia_pretranslation_benchmark import make_synthetic_extraction
          from wikidebia_corpus_init import build_corpus
          import wikidebia_validator.schema_validation as sv
          from wikidebia_validator.validator import validate_package

          SCOPES=["schema","coherence","graph","files","workflow"]
          if not sv._matches_attested_library_versions():
              raise RuntimeError("Pinned library versions are mandatory for this experiment")
          def native_if(cls, _expanded): return cls
          for count in (40, 300, 680):
              with tempfile.TemporaryDirectory(prefix="wikidebia-conditional-prod-") as tmp:
                  root=Path(tmp)
                  source=make_synthetic_extraction(root/"source",arguments=count,payload_bytes=1024)
                  build=root/"build"
                  build_corpus(source,build,debate_id="benchmark_pretranslation",short_code="BENCH",scope_summary=None,overwrite=False)
                  data={"old":[],"new":[]}
                  for round_no in range(7):
                      reports={}
                      for version in (("new","old") if round_no%2==0 else ("old","new")):
                          began=time.perf_counter()
                          if version=="old":
                              with patch.object(sv,"_guarded_registry_status_if",native_if):
                                  reports[version]=validate_package(build,scopes=SCOPES).to_dict()
                          else:
                              reports[version]=validate_package(build,scopes=SCOPES).to_dict()
                          data[version].append(time.perf_counter()-began)
                      if reports["new"]!=reports["old"]:
                          raise RuntimeError("Complete validator reports differed")
                      if reports["new"]["summary"]["errors"]:
                          raise RuntimeError("Normal synthetic build failed validation")
                  old=statistics.median(data["old"])
                  new=statistics.median(data["new"])
                  print("WIKIDEBIA_PRODUCTION_IF_BENCHMARK "+json.dumps({
                      "arguments":count,
                      "before_median_seconds":round(old,6),
                      "after_median_seconds":round(new,6),
                      "gain_percent":round((old-new)/old*100,2),
                      "before_samples_seconds":[round(x,6) for x in data["old"]],
                      "after_samples_seconds":[round(x,6) for x in data["new"]],
                      "iterations_per_variant":7,
                      "five_validation_scopes":True,
                      "complete_report_objects_identical":True,
                      "source_schema_files_unchanged":True,
                      "wiki_access_performed":False,
                  },sort_keys=True),flush=True)
          PY
