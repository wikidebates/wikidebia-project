name: Install tested cross-debate creation library (temporary)
on:
  push:
    branches: [feat/creation-cross-debate-library-20261121]
    paths: [.github/workflows/creation-library-install.yml]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install and verify the exact locally tested patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/creation-library-transfer-{00,01,02,03,04,05}.txt | base64 -d | xz -d > "$RUNNER_TEMP/creation-library.patch"
          echo "f92d14784298fab732145212e85725de87bedd3669831dac2d2d0776998ada34  $RUNNER_TEMP/creation-library.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/creation-library.patch"
          git apply --index "$RUNNER_TEMP/creation-library.patch"
          python -m pip install -r validator/requirements-dev.txt
          python -m pytest -q kit/tests/test_wikidebia_creation_library.py
          python kit/scripts/refresh_package_metadata.py --test-count 1877 --generated-date 2026-11-21 --check
          python validator/scripts/self_audit.py
          rm .github/creation-library-transfer-{00,01,02,03,04,05}.txt .github/workflows/creation-library-install.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "4c25d87af0ab3f5e20d05ad1b899a12837e7343d"
          git -c user.name="Wikidebia creation preparation" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "feat: reuse documentary discoveries between French debates"
          git push origin HEAD:feat/creation-cross-debate-library-20261121
