name: Temporary production nullable-oneOf differential benchmark
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r validator/requirements-dev.txt
      - name: Compare production fast path against original exact schema evaluator
        env:
          PYTHONPATH: kit/scripts:validator/src
        run: |
          python - <<'PY'
          import json
          import statistics
          import tempfile
          import time
          from pathlib import Path
          from unittest.mock import patch

          from wikidebia_pretranslation_benchmark import make_synthetic_extraction
          from wikidebia_corpus_init import build_corpus
          import wikidebia_validator.schema_validation as sv
          from wikidebia_validator.validator import validate_package

          SCOPES=["schema","coherence","graph","files","workflow"]
          def original_validator(cls, _expanded): return cls
          for n in (40,300,680):
              with tempfile.TemporaryDirectory(prefix="wikidebia-guarded-oneof-prod-") as dirname:
                  root=Path(dirname)
                  source=make_synthetic_extraction(root/"source",arguments=n,payload_bytes=1024)
                  corpus=root/"corpus"
                  build_corpus(source,corpus,debate_id="benchmark_pretranslation",short_code="BENCH",scope_summary=None,overwrite=False)
                  samples={"baseline":[],"optimized":[]}
                  for rep in range(7):
                      order=["baseline","optimized"] if rep%2 else ["optimized","baseline"]
                      reports={}
                      for version in order:
                          start=time.perf_counter()
                          if version=="baseline":
                              with patch.object(sv,"_guarded_registry_nullable_oneof",original_validator):
                                  reports[version]=validate_package(corpus,scopes=SCOPES).to_dict()
                          else:
                              reports[version]=validate_package(corpus,scopes=SCOPES).to_dict()
                          samples[version].append(time.perf_counter()-start)
                      if reports["baseline"]!=reports["optimized"]:
                          raise AssertionError("Full validator reports differ")
                      if reports["baseline"]["summary"]["errors"]:
                          raise AssertionError("Unexpected invalid synthetic package")
                  old=statistics.median(samples["baseline"])
                  new=statistics.median(samples["optimized"])
                  print("WIKIDEBIA_GUARDED_ONEOF_PRODUCTION_COMPARISON "+json.dumps({
                      "arguments":n,
                      "iterations_per_variant":7,
                      "median_baseline_seconds":round(old,6),
                      "median_optimized_seconds":round(new,6),
                      "reduction_percent":round((old-new)/old*100,2),
                      "before_samples":[round(x,6) for x in samples["baseline"]],
                      "after_samples":[round(x,6) for x in samples["optimized"]],
                      "full_reports_equal":True,
                      "schema_files_untouched":True,
                      "wiki_calls":0,
                  },sort_keys=True),flush=True)
          PY
