name: Creation audit source snapshot (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/creation-audit-source.yml

permissions:
  contents: read

jobs:
  source-snapshot:
    if: github.head_ref == 'feat/creation-context-quota-20261121'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Archive only tracked public source files
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/wikidebia-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: creation-audit-source
          path: ${{ runner.temp }}/wikidebia-source.zip
          retention-days: 1
