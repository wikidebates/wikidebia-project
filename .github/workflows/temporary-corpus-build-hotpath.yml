name: Temporary parser full pretranslation comparison
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r validator/requirements-dev.txt
          python -m pip install 'jsonschema==4.26.0' 'referencing==0.37.0'
      - name: Compare complete offline workflows using original and optimized parser
        env:
          PYTHONPATH: kit/scripts:kit/tests
        run: |
          python - <<'PY'
          import hashlib
          import json
          import statistics
          from pathlib import Path
          from unittest.mock import patch

          import wikidebia_graph_extract as ge
          from wikidebia_pretranslation_benchmark import run_benchmark
          from wikidebia_corpus_build import canonical_json
          from test_graph_extract_parser_fastpath import (
              _legacy_template_spans, _legacy_split_top_level,
          )

          scenarios=(
              "cold_build_validate_receipt",
              "resume_after_build_before_receipt",
              "resume_exact_verified_receipt",
          )
          project_root=Path.cwd()
          for arguments in (40,300,878):
              reports={"old_parser":[],"new_parser":[]}
              contracts=set()
              for i in range(3):
                  sequence=("old_parser","new_parser") if i%2 else ("new_parser","old_parser")
                  for mode in sequence:
                      spans=ge._template_spans if mode=="new_parser" else _legacy_template_spans
                      splitter=ge._split_top_level if mode=="new_parser" else _legacy_split_top_level
                      with (
                          patch.object(ge,"_template_spans",spans),
                          patch.object(ge,"_split_top_level",splitter),
                      ):
                          report=run_benchmark(
                              project_root, arguments=arguments,
                              payload_bytes=1024, iterations=1,
                          )
                      digest=report["report_sha256"]
                      unsigned=dict(report)
                      unsigned.pop("report_sha256")
                      if hashlib.sha256(canonical_json(unsigned)).hexdigest()!=digest:
                          raise RuntimeError("Tampered benchmark report")
                      quality=report["quality_controls"]
                      if (not quality["same_build_contract"]
                          or not quality["cold_validation_passed"]
                          or not quality["interrupted_validation_passed"]
                          or not quality["exact_receipt_verified"]
                          or quality["wiki_access_performed"]
                          or quality["translation_logic_exercised"]
                          or quality["real_snapshot_used"]):
                          raise RuntimeError("Benchmark safety controls failed")
                      contracts.add(report["fixture"]["build_contract_sha256"])
                      reports[mode].append({
                          name: {
                              "seconds": report["scenarios"][name]["median_seconds"],
                              "stages": {
                                  key: value["median_seconds"]
                                  for key,value in report["scenarios"][name]["stage_timings_seconds"].items()
                              },
                          } for name in scenarios
                      })
              if len(contracts)!=1:
                  raise RuntimeError("Source contracts changed between parsers")
              results={}
              for mode, rows in reports.items():
                  results[mode]={}
                  for name in scenarios:
                      samples=[entry[name]["seconds"] for entry in rows]
                      stage_names=set().union(*(entry[name]["stages"].keys() for entry in rows))
                      results[mode][name]={
                          "samples_seconds":samples,
                          "median_seconds":statistics.median(samples),
                          "stages_medians_seconds":{
                              key:statistics.median([
                                  entry[name]["stages"][key] for entry in rows
                              ]) for key in sorted(stage_names)
                          },
                      }
              print("WIKIDEBIA_PARSER_END_TO_END "+json.dumps({
                  "arguments":arguments,
                  "repetitions":3,
                  "build_contract_sha256":next(iter(contracts)),
                  "scenarios":results,
                  "quality_controls_verified":True,
                  "synthetic_only":True,
              },sort_keys=True),flush=True)
          PY
