name: Temporary corpus/contract-stage profiler
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r validator/requirements-dev.txt
      - name: Profile synthetic source contract and corpus build stage without changing output
        env:
          PYTHONPATH: kit/scripts:validator/src
        run: |
          python - <<'PY'
          import cProfile
          import json
          import pstats
          import statistics
          import tempfile
          import time
          from pathlib import Path
          from unittest.mock import patch

          import wikidebia_corpus_init as ci
          from wikidebia_pretranslation_benchmark import make_synthetic_extraction

          def measured(name, fn, wraps):
              totals = {key:{"count":0,"total":0.0} for key in wraps}
              originals={key:getattr(ci,key) for key in wraps}
              def make_wrapper(key, orig):
                  def wrapped(*args,**kwargs):
                      start=time.perf_counter()
                      try:return orig(*args,**kwargs)
                      finally:
                          row=totals[key]
                          row["count"]+=1
                          row["total"]+=time.perf_counter()-start
                  return wrapped
              with patch.multiple(ci,**{key:make_wrapper(key,orig) for key,orig in originals.items()}):
                  t0=time.perf_counter()
                  ret=fn()
                  total=time.perf_counter()-t0
              print("WIKIDEBIA_STAGE_PROFILE "+json.dumps({
                  "operation":name,
                  "overall_seconds":round(total,6),
                  "stages":{key:{"calls":v["count"],"cumulative_seconds":round(v["total"],6)}
                            for key,v in totals.items()},
              },sort_keys=True),flush=True)
              return ret

          wrappers=("resolve_extraction_input","_find_single","verify_extraction",
                    "_snapshot_page_path","source_fingerprint","sha256_file",
                    "copy_import_pages","extract_page_metadata","build_graph_objects",
                    "ordered_titles","normalize_title","write_json","write_build_contract_record",
                    "build_tree_fingerprint","compute_derived")

          with tempfile.TemporaryDirectory(prefix="wikidebia-construction-profile-") as temp:
              work=Path(temp)
              source=make_synthetic_extraction(work/"source",arguments=680,payload_bytes=1024)
              for i in range(3):
                  measured("verify_source_contract",
                      lambda:ci.compute_build_contract(
                          source,debate_id="benchmark_pretranslation",
                          short_code="BENCH",scope_summary=None),
                      wrappers)
                  measured("build_corpus",
                      lambda n=i:ci.build_corpus(
                          source,work/f"corpus-{n}",
                          debate_id="benchmark_pretranslation",short_code="BENCH",
                          scope_summary=None,overwrite=False),
                      wrappers)
              for name, action in [
                  ("verify_source_contract",lambda:ci.compute_build_contract(
                      source,debate_id="benchmark_pretranslation",
                      short_code="BENCH",scope_summary=None)),
                  ("build_corpus",lambda:ci.build_corpus(
                      source,work/"cprofile-build",
                      debate_id="benchmark_pretranslation",
                      short_code="BENCH",scope_summary=None,overwrite=False)),
              ]:
                  profiler=cProfile.Profile()
                  profiler.enable()
                  action()
                  profiler.disable()
                  stats=pstats.Stats(profiler)
                  rows=[]
                  for (filename,lineno,method),(primitive_calls,total_calls,self_time,cumulative_time,callers) in stats.stats.items():
                      if "wikidebia_corpus_init.py" not in filename and "pathlib" not in filename and "posixpath" not in filename and "json" not in filename and "io" not in filename and not filename.endswith("stat.py"):
                          continue
                      rows.append({
                          "symbol":filename.split("/")[-1]+":"+str(lineno)+":"+method,
                          "calls":total_calls,
                          "cum_seconds":round(cumulative_time,6),
                          "self_seconds":round(self_time,6),
                      })
                  rows.sort(key=lambda x:x["cum_seconds"],reverse=True)
                  print("WIKIDEBIA_CPROFILE_STAGE "+json.dumps({
                      "operation":name,"top":rows[:38],
                  },sort_keys=True),flush=True)
          PY
      - name: Pair baseline and proposed revision with byte-identical built files and receipts
        env:
          PYTHONPATH: kit/scripts:validator/src:tools
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from wikidebia_pretranslation_benchmark import make_synthetic_extraction
          from pretranslation_compare_revisions import compare_revisions

          with tempfile.TemporaryDirectory(prefix="wikidebia-contract-parity-") as tmp:
              root=Path(tmp)
              source=make_synthetic_extraction(
                  root/"source", arguments=680, payload_bytes=1024,
              )
              report=compare_revisions(
                  Path.cwd(),source,
                  baseline="11e9643b7205de2dd86bf4a3574beee95324ab97",
                  candidate="HEAD",
                  iterations=5,
              )
              controls=report["quality_controls"]
              assert report["argument_count"]==680
              assert report["identical_built_file_count"] >= 690
              assert all(controls[key] is True for key in (
                  "identical_built_file_sha256",
                  "exact_receipts_verified",
                  "signed_individual_reports_verified",
                  "identical_source_manifest_and_build_contract",
                  "initial_and_interrupted_validations_passed",
                  "snapshot_read_only",
              ))
              output={
                  "baseline":report["baseline_sha"],
                  "candidate":report["candidate_sha"],
                  "arguments":report["argument_count"],
                  "identical_built_files":report["identical_built_file_count"],
                  "validated_receipts":True,
                  "report_objects_verified":True,
                  "scenarios":{
                      name:{
                          "baseline_median_s":row["baseline"]["median_seconds"],
                          "optimized_median_s":row["candidate"]["median_seconds"],
                          "reduction_percent":row["change"]["elapsed_reduction_percent"],
                          "stage_medians":{
                              key:{
                                  "before_s":before["median_seconds"],
                                  "after_s":row["candidate"]["stage_timings_seconds"][key]["median_seconds"],
                              }
                              for key,before in row["baseline"]["stage_timings_seconds"].items()
                          },
                      }
                      for name,row in report["scenarios"].items()
                  },
              }
              print("WIKIDEBIA_CONTRACT_PAIRED_REVISIONS "+json.dumps(output,sort_keys=True),flush=True)
          PY
