name: Creation init source (temporary)
on:
  push:
    branches: [feat/creation-init-20261121]
    paths: [.github/workflows/creation-init-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: git archive --format=zip HEAD -o "$RUNNER_TEMP/creation-init-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: creation-init-source
          path: ${{ runner.temp }}/creation-init-source.zip
          retention-days: 1
