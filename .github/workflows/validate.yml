name: Validation des sources

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: validator/requirements-dev.txt
      - run: python -m pip install -r validator/requirements-dev.txt
      - run: PYTHONPATH=validator/src python -m pytest -q validator/tests
      - run: python -m pytest -q kit/tests --junitxml=/tmp/kit-tests.xml
      - run: python kit/scripts/refresh_package_metadata.py --junit-xml /tmp/kit-tests.xml --check
      - run: python validator/scripts/self_audit.py
      - run: python -m unittest discover -s deploy/tests -v
