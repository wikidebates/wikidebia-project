name: Refresh kit metadata for issue 65
on:
  push:
    branches:
      - optimize/content-addressed-checkpoint-inventory
      - optimize/compact-repository-index-failure-reports
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run kit tests and regenerate signed package metadata
        run: |
          python -m pip install -r validator/requirements-dev.txt
          python -m pytest -q kit/tests --junitxml=/tmp/kit-tests.xml
          python kit/scripts/refresh_package_metadata.py --junit-xml /tmp/kit-tests.xml
      - name: Commit metadata only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kit/TEST_REPORT.txt kit/PACKAGE_MANIFEST_SHA256.json kit/PACKAGE_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh signed kit metadata for issue 65'
            git push
          fi
