name: Temporary offline validator hotpath probe
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install -r validator/requirements-dev.txt
      - name: Profile identical synthetic corpus without any wiki access
        env:
          PYTHONPATH: validator/src:kit/scripts
        run: |
          python - <<'PY'
          import cProfile
          import json
          import pstats
          import statistics
          import tempfile
          import time
          from pathlib import Path

          from wikidebia_pretranslation_benchmark import make_synthetic_extraction
          from wikidebia_corpus_init import build_corpus
          from wikidebia_validator.validator import validate_package

          for arguments in (40, 120):
              with tempfile.TemporaryDirectory(prefix="wikidebia-schema-profile-") as tmp:
                  root = Path(tmp)
                  source = make_synthetic_extraction(root / "source", arguments=arguments, payload_bytes=1024)
                  target = root / "built"
                  build_corpus(source, target, debate_id="benchmark_pretranslation", short_code="BENCH", scope_summary=None, overwrite=False)
                  samples = []
                  baseline = None
                  for attempt in range(5):
                      start = time.perf_counter()
                      report = validate_package(target, scopes=["schema"])
                      samples.append(round(time.perf_counter() - start, 6))
                      if report.errors:
                          raise RuntimeError("Schema validation failed on fixture: " + report.to_text()[:1800])
                      current = report.to_dict()
                      if baseline is None:
                          baseline = current
                      elif baseline != current:
                          raise RuntimeError("Nondeterministic validator report")
                  profiler = cProfile.Profile()
                  profiler.enable()
                  profiled = validate_package(target, scopes=["schema"])
                  profiler.disable()
                  if profiled.to_dict() != baseline:
                      raise RuntimeError("Profiler changed validator report")
                  stats = pstats.Stats(profiler)
                  rows = []
                  for (path, line, function), (_primitive, calls, own, cumulative, _callers) in stats.stats.items():
                      if cumulative >= 0.0005:
                          rows.append((cumulative, calls, own, Path(path).name, line, function))
                  rows.sort(reverse=True)
                  print("WIKIDEBIA_SCHEMA_HOTPATH " + json.dumps({
                      "arguments": arguments,
                      "samples_seconds": samples,
                      "median_seconds": statistics.median(samples),
                      "top_cumulative": [
                          {"cumulative": round(c, 6), "calls": n, "own": round(own, 6), "source": f"{path}:{line}:{function}"}
                          for c,n,own,path,line,function in rows[:45]
                      ],
                  }, ensure_ascii=False))
          PY
      - name: Measure independent schema costs and graph reuse
        env:
          PYTHONPATH: validator/src:kit/scripts
        run: |
          python - <<'PY'
          import json
          import statistics
          import tempfile
          import time
          from pathlib import Path
          from unittest.mock import patch

          from wikidebia_pretranslation_benchmark import make_synthetic_extraction
          from wikidebia_corpus_init import build_corpus
          from wikidebia_validator import schema_validation as sv
          from wikidebia_validator.validator import validate_package

          for arguments in (40, 120, 300):
              with tempfile.TemporaryDirectory(prefix="wikidebia-schema-breakdown-") as tmp:
                  root = Path(tmp)
                  source = make_synthetic_extraction(root / "source", arguments=arguments, payload_bytes=1024)
                  built = root / "built"
                  build_corpus(source, built, debate_id="benchmark_pretranslation", short_code="BENCH", scope_summary=None, overwrite=False)
                  buckets = {}
                  original = sv.SchemaStore.validate
                  counts = {}
                  def measured(self, instance, schema_name, **kwargs):
                      tick = time.perf_counter()
                      result = original(self, instance, schema_name, **kwargs)
                      buckets.setdefault(schema_name, []).append(time.perf_counter() - tick)
                      return result
                  def original_fallback(*args, **kwargs):
                      return ()
                  baseline = None
                  for index in range(3):
                      with patch.object(sv.SchemaStore, "validate", measured):
                          report = validate_package(built, scopes=["schema"]).to_dict()
                      if baseline is None:
                          baseline = report
                      elif baseline != report:
                          raise RuntimeError("Unequal schema reports")
                  for index in range(3):
                      with patch.object(sv, "_reusable_graph_fields", original_fallback):
                          full = validate_package(built, scopes=["schema"]).to_dict()
                      if full != baseline:
                          raise RuntimeError("Graph reuse changed schema findings")
                  print("WIKIDEBIA_SCHEMA_BREAKDOWN " + json.dumps({
                      "arguments": arguments,
                      "per_schema": {
                          name: {"calls": len(values), "median_seconds_per_call": round(statistics.median(values), 6),
                                 "sum_seconds": round(sum(values), 6)}
                          for name, values in buckets.items()
                      },
                      "same_findings_with_full_graph": True
                  }, ensure_ascii=False))
          PY
      - name: Bound the meta-schema cost with an experimental bypass (NOT production)
        env:
          PYTHONPATH: validator/src:kit/scripts
        run: |
          python - <<'PY'
          import hashlib
          import json
          import statistics
          import tempfile
          import time
          from pathlib import Path
          from unittest.mock import patch

          from jsonschema import Draft202012Validator
          from wikidebia_pretranslation_benchmark import make_synthetic_extraction
          from wikidebia_corpus_init import build_corpus
          from wikidebia_validator.schema_validation import SchemaStore
          from wikidebia_validator.validator import validate_package
          import importlib.metadata as metadata

          store = SchemaStore()
          print("WIKIDEBIA_META_VERSION " + json.dumps({
              "jsonschema": metadata.version("jsonschema"),
              "referencing": metadata.version("referencing"),
              "digests": {
                  name: hashlib.sha256(json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False).encode("utf-8")).hexdigest()
                  for name, value in store.schemas.items()
              },
          }))
          for arguments in (40, 120, 300):
              with tempfile.TemporaryDirectory(prefix="wikidebia-check-schema-bound-") as tmp:
                  root = Path(tmp)
                  source = make_synthetic_extraction(root / "source", arguments=arguments, payload_bytes=1024)
                  built = root / "built"
                  build_corpus(source, built, debate_id="benchmark_pretranslation", short_code="BENCH", scope_summary=None, overwrite=False)
                  samples = {"full_check": [], "unchecked_experiment": []}
                  baseline = None
                  for i in range(6):
                      order = ("full_check", "unchecked_experiment") if i % 2 else ("unchecked_experiment", "full_check")
                      for mode in order:
                          start = time.perf_counter()
                          if mode == "full_check":
                              report = validate_package(built, scopes=["schema"]).to_dict()
                          else:
                              # Research only: never ship a blanket bypass.
                              with patch.object(Draft202012Validator, "check_schema", return_value=None):
                                  report = validate_package(built, scopes=["schema"]).to_dict()
                          samples[mode].append(time.perf_counter() - start)
                          if baseline is None:
                              baseline = report
                          elif baseline != report:
                              raise RuntimeError("Meta-schema experiment changed validation report")
                  print("WIKIDEBIA_META_BOUND " + json.dumps({
                      "arguments": arguments,
                      "medians_seconds": {k: round(statistics.median(v), 6) for k,v in samples.items()},
                      "raw_seconds": {k: [round(v, 6) for v in values] for k, values in samples.items()},
                      "reports_equal": True,
                      "safe_for_production": False
                  }))
          PY
      - name: Derive exact validator release metadata without pushing from CI
        env:
          PYTHONPATH: validator/src
        run: |
          python -m pytest -q validator/tests --junitxml=/tmp/schema-validator-tests.xml
          python - <<'PY'
          import subprocess
          import xml.etree.ElementTree as ET
          root = ET.parse("/tmp/schema-validator-tests.xml").getroot()
          count = int(root.get("tests")) - int(root.get("skipped", "0")) - int(root.get("failures", "0")) - int(root.get("errors", "0"))
          print("WIKIDEBIA_NEW_VALIDATOR_TEST_COUNT", count, flush=True)
          subprocess.run([
              "python", "validator/scripts/refresh_package_metadata.py",
              "--test-count", str(count), "--generated-date", "2026-11-20",
          ], check=True)
          print("WIKIDEBIA_BEGIN_META_DIFF", flush=True)
          subprocess.run(["git", "diff", "--", "validator/docs/TEST_REPORT.txt",
              "validator/docs/SELF_AUDIT_REPORT.txt",
              "validator/PACKAGE_MANIFEST_SHA256.json",
              "validator/PACKAGE_RECEIPT.json"], check=True)
          print("WIKIDEBIA_END_META_DIFF", flush=True)
          PY
