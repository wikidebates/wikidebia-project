name: Temporary attested allOf no-op profiling
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  profile-allof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r validator/requirements-dev.txt 'jsonschema==4.26.0' 'referencing==0.37.0'
      - name: Compare identical in-process validators on synthetic immutable graph
        env:
          PYTHONPATH: "validator/src:kit/scripts:."
        run: |
          python - <<'PY'
          import hashlib
          import json
          import statistics
          import tempfile
          import time
          from pathlib import Path
          from unittest.mock import patch
          from jsonschema.validators import validator_for
          from wikidebia_validator import schema_validation as sv
          from wikidebia_validator.validator import validate_package
          from wikidebia_pretranslation_benchmark import make_synthetic_extraction
          from wikidebia_corpus_init import build_corpus
          from tools.profile_validator_offline import _normalize_report

          scopes=("schema","coherence","graph","files","workflow")
          def digest(path):
              return {p.relative_to(path).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in sorted(path.rglob("*")) if p.is_file()}
          guardcheck=sv.SchemaStore()
          if not guardcheck._attested_runtime:
              raise AssertionError("Pinned runtime attestation did not activate")
          guardcheck.validate({}, "argument_registry.schema.json")
          compiled=guardcheck._compiled["argument_registry.schema.json"][1]
          assert type(compiled).VALIDATORS["allOf"] is not validator_for(
              guardcheck.schemas["argument_registry.schema.json"]).VALIDATORS["allOf"]

          for args,loops in ((40,3),(680,5)):
              with tempfile.TemporaryDirectory(prefix="wikidebia-allof-synthetic-") as temp:
                  temp=Path(temp)
                  source=make_synthetic_extraction(temp/"source",arguments=args,payload_bytes=80)
                  original=digest(source)
                  target=temp/"corpus"
                  build_corpus(source,target,debate_id="benchmark_pretranslation",
                               short_code="BENCH",scope_summary=None,overwrite=False)
                  corpus_before=digest(target)
                  measurements={"baseline":[],"candidate":[]}
                  for round_index in range(loops):
                      reports={}
                      order=("candidate","baseline") if round_index%2==0 else ("baseline","candidate")
                      for variant in order:
                          started=time.perf_counter()
                          if variant=="baseline":
                              with patch.object(sv,"_guarded_registry_false_status_allof",
                                                side_effect=lambda cls, expanded:cls):
                                  raw=validate_package(target,scopes=scopes).to_dict()
                          else:
                              raw=validate_package(target,scopes=scopes).to_dict()
                          elapsed=time.perf_counter()-started
                          measurements[variant].append(elapsed)
                          reports[variant]=_normalize_report(raw)
                      if reports["baseline"]!=reports["candidate"]:
                          raise AssertionError("Full validator report changed")
                  if digest(source)!=original or digest(target)!=corpus_before:
                      raise AssertionError("Immutable source/build changed")
                  baseline=statistics.median(measurements["baseline"])
                  candidate=statistics.median(measurements["candidate"])
                  print("WIKIDEBIA_ALLOF_PROFILE "+json.dumps({
                      "argument_count":args, "repetitions":loops,
                      "baseline_seconds":round(baseline,6),
                      "candidate_seconds":round(candidate,6),
                      "elapsed_reduction_percent":round((baseline-candidate)/baseline*100,2),
                      "samples_seconds":{key:[round(x,6) for x in values]
                                         for key,values in measurements.items()},
                      "report_equal":True,"sources_unchanged":True,
                      "built_files_sha256_unchanged":True,
                      "built_file_count":len(corpus_before),
                      "wiki_calls":0,"llm_calls":0,
                  },sort_keys=True),flush=True)
          PY
