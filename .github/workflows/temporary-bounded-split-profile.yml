name: Temporary bounded MediaWiki split comparison
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  measured-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validator dependencies and pinned schema engine
        run: |
          python -m pip install -r validator/requirements-dev.txt
          python -m pip install 'jsonschema==4.26.0' 'referencing==0.37.0'
      - name: Compare complete corpus files with legacy and bounded parsers
        env:
          PYTHONPATH: kit/scripts:kit/tests
        run: |
          python - <<'PY'
          import hashlib
          import json
          import statistics
          import tempfile
          import time
          from pathlib import Path
          from unittest.mock import patch
          import wikidebia_corpus_init as ci
          import wikidebia_graph_extract as graph
          from wikidebia_pretranslation_benchmark import make_synthetic_extraction
          from test_graph_extract_parser_fastpath import _legacy_split_top_level

          actual = graph._split_top_level
          def fingerprints(root):
              return {
                  p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in sorted(root.rglob("*")) if p.is_file()
              }

          for count in (40,300,878):
              with tempfile.TemporaryDirectory(prefix="wikidebia-bounded-split-pair-") as tmp:
                  root=Path(tmp)
                  source=make_synthetic_extraction(root/"source",arguments=count,payload_bytes=1024)
                  baseline=None
                  samples={"legacy":[],"bounded":[]}
                  for i in range(5):
                      order=("legacy","bounded") if i%2 else ("bounded","legacy")
                      for mode in order:
                          target=root/f"{mode}-{i}"
                          with (patch.object(graph,"_split_top_level",
                                            _legacy_split_top_level if mode=="legacy" else actual),
                                patch.object(ci,"now_iso",lambda:"2026-11-20T12:00:00+00:00")):
                              tick=time.perf_counter()
                              result=ci.build_corpus(source,target,debate_id="benchmark_pretranslation",
                                  short_code="BENCH",scope_summary=None,overwrite=False)
                              samples[mode].append(time.perf_counter()-tick)
                          if result.get("status")!="created":
                              raise RuntimeError("Unexpected corpus status")
                          signature=(result["build_contract_sha256"], fingerprints(target))
                          if baseline is None:
                              baseline=signature
                          elif signature!=baseline:
                              changed=sorted(k for k in set(baseline[1]) & set(signature[1])
                                  if baseline[1][k]!=signature[1][k])
                              raise RuntimeError("Changed output corpus files: "+str(changed[:10]))
                  old,new=(statistics.median(samples[mode]) for mode in ("legacy","bounded"))
                  print("WIKIDEBIA_BOUNDED_SPLIT_BUILD "+json.dumps({
                      "arguments":count,
                      "medians_seconds":{"legacy":round(old,6),"bounded":round(new,6)},
                      "percent_reduction":round(100*(1-new/old),2),
                      "samples_seconds":{mode:[round(x,6) for x in values]
                                          for mode,values in samples.items()},
                      "files_sha256_identical":True,
                      "file_count":len(baseline[1]),
                      "contract_sha256":baseline[0],
                  }),flush=True)
          PY
      - name: Compare the three end-to-end pretranslation resume paths offline
        env:
          PYTHONPATH: kit/scripts:kit/tests
        run: |
          python - <<'PY'
          import hashlib
          import json
          import statistics
          from pathlib import Path
          from unittest.mock import patch
          import wikidebia_graph_extract as graph
          from wikidebia_pretranslation_benchmark import run_benchmark
          from wikidebia_corpus_build import canonical_json
          from test_graph_extract_parser_fastpath import _legacy_split_top_level

          actual = graph._split_top_level
          scenarios=("cold_build_validate_receipt",
                     "resume_after_build_before_receipt",
                     "resume_exact_verified_receipt")
          for count in (40,300,878):
              samples={"legacy":[],"bounded":[]}
              contracts=set()
              for i in range(3):
                  order=("bounded","legacy") if i%2==0 else ("legacy","bounded")
                  for mode in order:
                      with patch.object(graph,"_split_top_level",
                                        _legacy_split_top_level if mode=="legacy" else actual):
                          report=run_benchmark(Path.cwd(),arguments=count,
                                               payload_bytes=1024,iterations=1)
                      digest=report.pop("report_sha256")
                      if digest!=hashlib.sha256(canonical_json(report)).hexdigest():
                          raise RuntimeError("Signed benchmark report mismatch")
                      quality=report["quality_controls"]
                      if (not quality["same_build_contract"] or
                          not quality["cold_validation_passed"] or
                          not quality["interrupted_validation_passed"] or
                          not quality["exact_receipt_verified"] or
                          quality["real_snapshot_used"] or
                          quality["wiki_access_performed"] or
                          quality["translation_logic_exercised"]):
                          raise RuntimeError("Benchmark safety controls failed")
                      contracts.add(report["fixture"]["build_contract_sha256"])
                      samples[mode].append({name:{
                          "seconds":report["scenarios"][name]["median_seconds"],
                          "stages":{k:v["median_seconds"] for k,v in
                                    report["scenarios"][name]["stage_timings_seconds"].items()},
                      } for name in scenarios})
              if len(contracts)!=1:
                  raise RuntimeError("Inconsistent source contracts")
              outcomes={}
              for mode,values in samples.items():
                  outcomes[mode]={name:{
                      "median_seconds":round(statistics.median(v[name]["seconds"] for v in values),6),
                      "raw_seconds":[v[name]["seconds"] for v in values],
                      "stage_median_seconds":{
                          stage:round(statistics.median(v[name]["stages"][stage] for v in values),6)
                          for stage in sorted(values[0][name]["stages"])
                      },
                  } for name in scenarios}
              print("WIKIDEBIA_BOUNDED_SPLIT_E2E "+json.dumps({
                  "arguments":count,"repetitions":3,
                  "contract_sha256":next(iter(contracts)),
                  "quality_controls_verified":True,
                  "scenarios":outcomes,
              }),flush=True)
          PY
      - name: Run complete kit tests and derive signed package metadata
        env:
          PYTHONPATH: kit/scripts
        run: |
          python -m pytest -q kit/tests --junitxml=/tmp/bounded-parser-tests.xml
          python - <<'PY'
          import subprocess
          import xml.etree.ElementTree as ET
          root=ET.parse("/tmp/bounded-parser-tests.xml").getroot()
          suites=[root] if root.get("tests") is not None else list(root.findall("./testsuite"))
          passed=sum(int(s.get("tests","0"))-int(s.get("failures","0"))-
                     int(s.get("errors","0"))-int(s.get("skipped","0")) for s in suites)
          print("WIKIDEBIA_BOUNDED_SPLIT_KIT_TESTS",passed,flush=True)
          subprocess.run(["python","kit/scripts/refresh_package_metadata.py",
              "--junit-xml","/tmp/bounded-parser-tests.xml","--generated-date","2026-11-20"],check=True)
          print("WIKIDEBIA_BOUNDED_BEGIN_METADATA_DIFF",flush=True)
          subprocess.run(["git","diff","--","kit/PACKAGE_MANIFEST_SHA256.json",
              "kit/PACKAGE_RECEIPT.json","kit/TEST_REPORT.txt"],check=True)
          print("WIKIDEBIA_BOUNDED_END_METADATA_DIFF",flush=True)
          PY
