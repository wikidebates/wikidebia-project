name: Temporary offline frozen-snapshot comparison integration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the same dependency versions used by both historical revisions
        run: |
          python -m pip install -r validator/requirements-dev.txt
          python -m pip install 'jsonschema==4.26.0' 'referencing==0.37.0'
      - name: Prove local Git archive, source immutability, report signature and safety
        env:
          PYTHONPATH: kit/scripts
          WIKIDEBIA_COMPARE_INTEGRATION: "1"
        run: python -m pytest -q tools/test_pretranslation_compare_revisions.py
