name: Refresh kit metadata for PR 82
on:
  push:
    branches:
      - test/pretranslation-resume-regression-81
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q kit/tests --junitxml=/tmp/kit-tests.xml
      - run: python kit/scripts/refresh_package_metadata.py --junit-xml /tmp/kit-tests.xml
      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kit/TEST_REPORT.txt kit/PACKAGE_MANIFEST_SHA256.json kit/PACKAGE_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh kit metadata after pretranslation tests"
            git push
          fi
