name: Temporary DAG per-root analytics benchmark
on:
  pull_request:
    paths:
      - .github/workflows/temporary-dag-root-metrics-benchmark.yml
permissions:
  contents: read
jobs:
  compare:
    if: github.head_ref == 'perf/graph-analyze-dag-suffix-counts-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r validator/requirements-dev.txt
      - name: Exact path-count, root and safety tests
        env:
          PYTHONPATH: kit/scripts:kit/tests
        run: python -m pytest -q kit/tests/test_graph_analyze_dag_suffix_counts.py
      - name: Compare complete graph analytics against pinned main
        env:
          PYTHONPATH: kit/scripts:kit/tests
        run: |
          git show 0b1181720a79eedfc32ad579c797dc63749437e8:kit/scripts/wikidebia_graph_extract.py > /tmp/baseline_graph_extract.py
          python - <<'PY'
          import importlib.util, json, statistics, sys, time
          import wikidebia_graph_extract as updated
          from test_graph_analyze_dag_suffix_counts import synthetic_result

          spec=importlib.util.spec_from_file_location('baseline_graph_extract','/tmp/baseline_graph_extract.py')
          original=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=original
          spec.loader.exec_module(original)

          def make_case(shape, root_count, shared_count):
              roots=[f'R{i:04d}' for i in range(root_count)]
              shared=[f'S{i:04d}' for i in range(shared_count)]
              if shape=='separate':
                  edges=[(roots[i],'justification',shared[i]) for i in range(root_count)]
              elif shape=='shared_chain':
                  edges=[(r,'justification',shared[0]) for r in roots]
                  edges += [(shared[i],'objection',shared[i+1]) for i in range(shared_count-1)]
              elif shape=='diamonds':
                  edges=[(r,'justification',shared[0]) for r in roots]
                  edges += [(shared[i],'justification',shared[i+1]) for i in range(shared_count-1)]
                  edges += [(shared[i],'objection',shared[i+2]) for i in range(shared_count-2)]
              elif shape=='single_chain':
                  edges=[(shared[i],'justification',shared[i+1]) for i in range(shared_count-1)]
                  edges.insert(0,(roots[0],'justification',shared[0]))
              else:
                  raise ValueError(shape)
              return synthetic_result(
                  [*roots,*shared],roots[:root_count//2],roots[root_count//2:],edges
              )
          scenarios=[
              ('separate',120,120,5),
              ('separate',300,300,5),
              ('separate',700,700,3),
              ('shared_chain',20,220,5),
              ('shared_chain',80,440,3),
              ('diamonds',12,80,5),
              ('diamonds',25,130,3),
              ('single_chain',1,1200,5),
          ]
          for shape,root_count,shared_count,reps in scenarios:
              graph=make_case(shape,root_count,shared_count)
              results={'baseline':[], 'suffix':[]}
              versions={'baseline':original.analyze_graph,'suffix':updated.analyze_graph}
              reference=None
              for trial in range(reps):
                  pair={}
                  for version in (('baseline','suffix') if trial%2==0 else ('suffix','baseline')):
                      before=time.perf_counter()
                      output=versions[version](graph)
                      seconds=time.perf_counter()-before
                      pair[version]=output
                      results[version].append(round(seconds,6))
                  assert pair['baseline']==pair['suffix'], (shape,root_count,'full_graph_output_changed')
                  if reference is None: reference=pair['baseline']
                  assert reference==pair['baseline'], (shape,root_count,'nondeterministic_output')
                  assert len(reference['branches_niveau_1'])==root_count
              med={key:statistics.median(samples) for key,samples in results.items()}
              print('DAG_MEASURE',json.dumps({
                  'shape':shape,'roots':root_count,'nodes':root_count+shared_count,
                  'medians_seconds':med,'samples_seconds':results,
                  'gain_percent':round(100*(1-med['suffix']/med['baseline']),2),
                  'complete_graph_and_root_stats_identical':True,
                  'no_network_calls':True,
              },sort_keys=True),flush=True)
          PY
