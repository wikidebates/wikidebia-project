name: Temporary validator iterative cycle depth/parity test
on:
  pull_request:
    paths:
      - .github/workflows/temporary-cycle-depth-parity.yml
permissions:
  contents: read
jobs:
  compare:
    if: github.head_ref == 'fix/validator-iterative-cycle-scan-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r validator/requirements-dev.txt
      - name: Cycle-order oracle, >1000-node graph and deep cycle tests
        env:
          PYTHONPATH: validator/src
        run: python -m pytest -q validator/tests/test_graph_iterative_cycles.py
      - name: Full report parity for shallow cyclic and noncyclic packages
        env:
          PYTHONPATH: validator/src
        run: |
          git show 5e1cdb85b10d19f8bb83587cc2c0218a0604c165:validator/src/wikidebia_validator/graph.py > /tmp/baseline_validator_graph.py
          python - <<'PY'
          import importlib.util, json, statistics, sys, tempfile, time
          from pathlib import Path
          from unittest.mock import patch
          from wikidebia_validator import validator as driver
          from validator.tests.helpers import create_graph_package, dump

          spec=importlib.util.spec_from_file_location(
              'wikidebia_validator.baseline_graph','/tmp/baseline_validator_graph.py')
          old=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=old
          spec.loader.exec_module(old)

          for case in ('valid','two_cycle','self_cycle','multi_cycle','bad_endpoints'):
              with tempfile.TemporaryDirectory(prefix='cycle-parity-') as root:
                  base=Path(root)
                  create_graph_package(base)
                  source=base/'data/registre_debat.json'
                  doc=json.loads(source.read_text(encoding='utf-8'))
                  if case=='two_cycle':
                      doc['graph']['edges']=[
                          {'id':'E00001','parent_node_id':'A0001','child_node_id':'A0002',
                           'relation':'justification','order':1,'status':'active'},
                          {'id':'E00002','parent_node_id':'A0002','child_node_id':'A0001',
                           'relation':'objection','order':1,'status':'active'},
                      ]
                  elif case=='self_cycle':
                      doc['graph']['edges']=[
                          {'id':'E00001','parent_node_id':'A0001','child_node_id':'A0001',
                           'relation':'justification','order':1,'status':'active'},
                      ]
                  elif case=='multi_cycle':
                      doc['graph']['edges']=[
                          {'id':f'E{i:05d}','parent_node_id':a,'child_node_id':b,
                           'relation':'justification','order':i,'status':'active'}
                          for i,(a,b) in enumerate([
                              ('A0001','A0002'),('A0002','A0001'),
                              ('A0002','A0002'),('A0001','A0002')
                          ],1)
                      ]
                  elif case=='bad_endpoints':
                      doc['graph']['edges']=[
                          {'id':'E00001','parent_node_id':'A0001','child_node_id':'GONE',
                           'relation':'objection','order':1,'status':'active'},
                      ]
                  if case!='valid':dump(source,doc)
                  before={}
                  for name,fn in (('baseline',old.validate_graph),('iterative',driver.validate_graph)):
                      with patch.object(driver,'validate_graph',fn):
                          start=time.perf_counter()
                          report=driver.validate_package(base,scopes=['graph']).to_dict()
                          elapsed=time.perf_counter()-start
                          before[name]=report
                  assert before['baseline']==before['iterative'], ('changed_findings_or_metrics',case)
                  print('PARITY',json.dumps({
                      'case':case,
                      'findings':len(before['baseline']['findings']),
                      'codes':[x['code'] for x in before['baseline']['findings']],
                      'complete_report_equal':True
                  },sort_keys=True),flush=True)

          # Demonstrate the actual incident: the pinned historical cycle
          # traversal aborts with WDV-INT-001 beyond recursion depth, while
          # the new traversal completes the exact same valid graph.
          from validator.tests.test_graph_iterative_cycles import _deep_package
          with tempfile.TemporaryDirectory(prefix='cycle-long-proof-') as root:
              package=Path(root)
              _deep_package(package,chain_length=1150)
              with patch.object(driver,'validate_graph',old.validate_graph):
                  old_report=driver.validate_package(package,scopes=['graph'])
              new_report=driver.validate_package(package,scopes=['graph'])
              old_codes=[f.code for f in old_report.findings]
              new_codes=[f.code for f in new_report.findings]
              assert 'WDV-INT-001' in old_codes,old_codes
              assert 'WDV-INT-001' not in new_codes,new_codes
              assert new_report.errors==0,new_codes
              print('DEEP_PROOF',json.dumps({
                  'nodes':1152,'old_codes':old_codes,'new_codes':new_codes,
                  'old_internal_failure_reproduced':True,'new_graph_validation_passed':True
              },sort_keys=True),flush=True)
          PY
